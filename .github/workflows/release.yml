name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the changelog needs the history
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the version on the Go proxy
        # outside the module: go refuses a version of the main module
        working-directory: ${{ runner.temp }}
        run: go list -m "github.com/anotherhadi/httpql@${GITHUB_REF_NAME}"
        env:
          GOPROXY: https://proxy.golang.org
